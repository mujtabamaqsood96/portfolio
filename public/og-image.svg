<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0a0f" />
      <stop offset="1" stop-color="#11111c" />
    </linearGradient>
    <radialGradient id="orbCyan" cx="180" cy="180" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.55" />
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbViolet" cx="1020" cy="500" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.5" />
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0" />
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" fill-opacity="0.06" />
    </pattern>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e5e7eb" />
      <stop offset="0.5" stop-color="#22d3ee" />
      <stop offset="1" stop-color="#a78bfa" />
    </linearGradient>
    <linearGradient id="monoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" />
      <stop offset="1" stop-color="#a78bfa" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#dots)" />
  <rect width="1200" height="630" fill="url(#orbCyan)" />
  <rect width="1200" height="630" fill="url(#orbViolet)" />

  <!-- Monogram badge -->
  <g transform="translate(80,80)">
    <rect width="96" height="96" rx="22" fill="url(#monoGrad)" />
    <text
      x="48"
      y="68"
      text-anchor="middle"
      font-family="'Space Grotesk', 'Inter', system-ui, sans-serif"
      font-weight="700"
      font-size="46"
      fill="#06121a"
      letter-spacing="-2"
    >MK</text>
  </g>

  <!-- Status pill -->
  <g transform="translate(196, 116)">
    <rect width="220" height="32" rx="16" fill="#22d3ee" fill-opacity="0.1" stroke="#22d3ee" stroke-opacity="0.4" />
    <circle cx="18" cy="16" r="4" fill="#22c55e" />
    <text x="32" y="21" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#22d3ee" letter-spacing="1">
      AVAILABLE FOR 2026
    </text>
  </g>

  <!-- Name -->
  <text
    x="80"
    y="320"
    font-family="'Space Grotesk', 'Inter', system-ui, sans-serif"
    font-weight="700"
    font-size="120"
    fill="url(#nameGrad)"
    letter-spacing="-5"
  >Mujtaba Khan</text>

  <!-- Tagline -->
  <text
    x="80"
    y="380"
    font-family="'JetBrains Mono', ui-monospace, monospace"
    font-size="22"
    fill="#9ca3af"
    letter-spacing="0.5"
  >&gt; Computer Engineer ù FPGA ù Edge AI ù Embedded</text>

  <!-- Sub -->
  <text
    x="80"
    y="430"
    font-family="'Inter', system-ui, sans-serif"
    font-size="20"
    fill="#9ca3af"
  >Application Engineer ∑ Lattice Semiconductor</text>
  <text
    x="80"
    y="458"
    font-family="'Inter', system-ui, sans-serif"
    font-size="20"
    fill="#9ca3af"
  >Final-year CE student @ Universiti Teknologi PETRONAS</text>

  <!-- Footer line -->
  <line x1="80" y1="540" x2="1120" y2="540" stroke="#1f1f2e" />

  <text
    x="80"
    y="580"
    font-family="'JetBrains Mono', ui-monospace, monospace"
    font-size="16"
    fill="#6b7280"
    letter-spacing="0.5"
  >mujtaba_22008474@utp.edu.my</text>

  <text
    x="1120"
    y="580"
    text-anchor="end"
    font-family="'JetBrains Mono', ui-monospace, monospace"
    font-size="16"
    fill="#6b7280"
    letter-spacing="0.5"
  >Perak, Malaysia</text>
</svg>
